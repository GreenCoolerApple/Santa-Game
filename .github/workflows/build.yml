name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :android:assembleDebug --parallel --build-cache
          mv android/build/outputs/apk/debug/*.apk Santa-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Santa-Android
          path: Santa-Android.apk
          if-no-files-found: error
